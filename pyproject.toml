[project]
name = "extranjeria-bot"
version = "0.1.0"
description = "Bot de Telegram de orientación y captación para gestoría de extranjería"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "python-telegram-bot>=21.0",
    "chromadb>=0.5",
    "anthropic>=0.34",
    "pypdf>=4.0",
    "pytesseract>=0.3",
    "pdf2image>=1.17",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "voyageai>=0.2",
    "google-genai>=1.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["extranjeria_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
